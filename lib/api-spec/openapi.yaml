openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: createContact
      tags: [contact]
      summary: Submit a contact form
      description: Saves a contact form submission to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Submission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Invalid input
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactInput:
      type: object
      required:
        - name
        - email
        - source
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        organization:
          type: ["string", "null"]
        interest:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        source:
          type: string
          minLength: 1
    ContactSubmission:
      type: object
      required:
        - id
        - name
        - email
        - source
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        organization:
          type: ["string", "null"]
        interest:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        source:
          type: string
        createdAt:
          type: string
          format: date-time
