<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edited Image Preview</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background:
          linear-gradient(45deg, #d8d8d8 25%, transparent 25%),
          linear-gradient(-45deg, #d8d8d8 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #d8d8d8 75%),
          linear-gradient(-45deg, transparent 75%, #d8d8d8 75%);
        background-color: #f7f7f7;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
        background-size: 32px 32px;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      img {
        display: block;
        width: min(100%, 800px);
        height: auto;
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.22);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="dreamstime-sunrise-blur-75.png" alt="Cloudscape over the sea at sunrise with slight blur and 75% opacity">
    </main>
  </body>
</html>
